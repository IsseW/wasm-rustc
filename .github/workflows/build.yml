# Build a cranelift-backed rustc.wasm + sysroots and (optionally) publish them as a Release.
#
# bjorn3/rust's compile_rustc_for_wasm20 branch already ships a `bootstrap.toml` configured for this:
#   host = ["wasm32-wasip1"], per-target codegen-backends = ["cranelift"], and download-ci-llvm = true
#   (a PREBUILT LLVM is downloaded — no LLVM is compiled from source). It expects WASI SDK 32.0.
# So the build is just: fetch WASI SDK 32, then `x.py install`. No toolchain-for-building-rustc, no
# host-LLVM build. Runs on the free ubuntu-latest runner. See docs/BUILDING.md.
name: Build rustc.wasm

on:
  workflow_dispatch:
    inputs:
      rust_branch:
        description: bjorn3/rust branch to build
        default: compile_rustc_for_wasm20
        required: true
      tag:
        description: version tag for the artifacts (e.g. rust-nightly-2026-07)
        required: true
      publish:
        description: also create a GitHub Release from the built artifacts
        type: boolean
        default: false

permissions:
  contents: write   # needed only when publish=true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under the 6 h hosted-runner cap
    steps:
      - name: Clone bjorn3/rust
        # Plain `git clone`, NOT actions/checkout. actions/checkout leaves a detached HEAD with a
        # narrow refspec, which breaks bootstrap's download-ci-llvm commit detection — it then falls
        # back to the fork HEAD (bjorn3 commit), for which rust-lang CI has no LLVM artifact → 404.
        # A normal clone lets bootstrap walk history to the real upstream LLVM commit (which HAS an
        # artifact), exactly as the working local build does. x.py auto-inits the submodules it needs.
        run: git clone --branch "${{ inputs.rust_branch }}" https://github.com/bjorn3/rust rust

      - name: Checkout this repo (scripts)
        uses: actions/checkout@v4
        with:
          path: wasm-rustc

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup swap (10 GB)
        uses: thejerrybao/setup-swap-space@v1
        with:
          swap-size-gb: 10
          remove-existing-swap-files: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config zstd

      - name: Download WASI SDK 32
        working-directory: rust
        run: |
          # bootstrap.toml references ./wasi-sdk-32.0-x86_64-linux/... relative to this dir.
          curl -fL -o wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-32/wasi-sdk-32.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk.tar.gz && rm wasi-sdk.tar.gz
          test -x wasi-sdk-32.0-x86_64-linux/bin/clang
          echo "WASI SDK ready: $(ls -d wasi-sdk-32.0-x86_64-linux)"
          # bootstrap requires WASI_SDK_PATH as an env var when building a -wasi target on CI
          # (cc_detect.rs) — the bootstrap.toml relative paths alone aren't accepted there.
          echo "WASI_SDK_PATH=$PWD/wasi-sdk-32.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=$PWD/wasi-sdk-32.0-x86_64-linux/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Provide the wild linker (patched to ./wild/libwild)
        working-directory: rust
        run: |
          # The branch's Cargo.toml has [patch.crates-io] libwild = { path = "wild/libwild" } but
          # doesn't vendor wild or list it as a submodule — clone it at the rev Cargo.lock pins.
          rev="$(grep -A3 'name = "libwild"' Cargo.lock | grep -oE 'wild\.git#[0-9a-f]{7,40}' | head -1 | sed 's/.*#//')"
          echo "wild rev: ${rev:-<none; using default branch>}"
          git clone https://github.com/wild-linker/wild.git wild
          [ -n "$rev" ] && git -C wild checkout "$rev"
          test -e wild/libwild/Cargo.toml

      - name: Configure riscv64 target (cc=clang, no-std)
        working-directory: rust
        run: |
          # The riscv64 no_std sysroot build wants riscv64-unknown-elf-gcc (absent); use clang instead.
          sudo apt-get install -y clang
          grep -q riscv64gc-unknown-none-elf bootstrap.toml || \
            printf '\n[target."riscv64gc-unknown-none-elf"]\ncc = "clang"\nno-std = true\n' >> bootstrap.toml

      - name: Build rustc.wasm (cranelift, prebuilt CI LLVM) — long
        working-directory: rust
        run: |
          # Uses the branch's shipped bootstrap.toml (host=wasm32-wasip1, cranelift, download-ci-llvm).
          python3 x.py install

      - name: Build riscv64 no_std sysroot
        working-directory: rust
        run: python3 x.py build library --target riscv64gc-unknown-none-elf

      - name: Show build tree (diagnostic)
        working-directory: rust
        run: |
          echo "== rustc.wasm =="; find . -name 'rustc.wasm' 2>/dev/null
          echo "== riscv64 sysroot lib dirs =="; find . -type d -path '*rustlib/riscv64gc-unknown-none-elf/lib' 2>/dev/null
          echo "== x86_64 std lib dirs =="; find . -type d -path '*lib/rustlib/x86_64-unknown-linux-gnu/lib' 2>/dev/null

      - name: Package artifacts
        env:
          RUST_DIR: ${{ github.workspace }}/rust
          OUT_DIR: ${{ github.workspace }}/out
        run: wasm-rustc/scripts/package-artifacts.sh

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rustc-wasm-${{ inputs.tag }}
          path: out/*.tar.zst
          retention-days: 7

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-${{ inputs.tag }}
          path: out/SHA256SUMS
          retention-days: 30

      - name: Publish Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "artifacts-${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "artifacts-${{ inputs.tag }}" \
            --notes "cranelift rustc.wasm + sysroots (branch ${{ inputs.rust_branch }}). Paste SHA256SUMS into the site's artifacts.lock." \
            out/rustc-wasm.tar.zst out/riscv64-sysroot.tar.zst out/std-sysroot.tar.zst out/SHA256SUMS

# Build a cranelift-backed rustc.wasm + sysroots and (optionally) publish them as a Release.
#
# bjorn3/rust's compile_rustc_for_wasm20 branch already ships a `bootstrap.toml` configured for this:
#   host = ["wasm32-wasip1"], per-target codegen-backends = ["cranelift"], and download-ci-llvm = true
#   (a PREBUILT LLVM is downloaded — no LLVM is compiled from source). It expects WASI SDK 32.0.
# So the build is just: fetch WASI SDK 32, then `x.py install`. No toolchain-for-building-rustc, no
# host-LLVM build. Runs on the free ubuntu-latest runner. See docs/BUILDING.md.
name: Build rustc.wasm

on:
  workflow_dispatch:
    inputs:
      rust_repo:
        description: rust fork to build (carries the Phase-B changes as commits)
        default: AngelOnFira/rust
        required: true
      rust_ref:
        description: branch/rev of the fork (riw-wasm20 = bjorn3 wasm20 + Phase B + vendored clif2wasm/riwl)
        default: riw-wasm20
        required: true
      playground_repo:
        description: egui playground repo holding the `toolchain/` crate the egui rlibs are built from
        default: IsseW/egui-playground
        required: true
      playground_ref:
        description: branch/rev of the playground repo
        default: main
        required: true
      tag:
        description: version tag for the artifacts (e.g. rust-nightly-2026-07)
        required: true
      publish:
        description: also create a GitHub Release from the built artifacts
        type: boolean
        default: false

permissions:
  contents: write   # needed only when publish=true

jobs:
  # The long job: rustc.wasm itself (+ the riscv64 no_std and x86_64 metadata-std
  # sysroots that ride along in the same tree).
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # stay under the 6 h hosted-runner cap
    steps:
      - name: Clone the rust fork (riw-wasm20)
        # Plain `git clone`, NOT actions/checkout. actions/checkout leaves a detached HEAD with a
        # narrow refspec, which breaks bootstrap's download-ci-llvm commit detection — it then falls
        # back to the fork HEAD (bjorn3 commit), for which rust-lang CI has no LLVM artifact → 404.
        # A normal clone lets bootstrap walk history to the real upstream LLVM commit (which HAS an
        # artifact), exactly as the working local build does. x.py auto-inits the submodules it needs.
        run: |
          git clone https://github.com/${{ inputs.rust_repo }} rust
          git -C rust checkout "${{ inputs.rust_ref }}"

      - name: Checkout this repo (scripts)
        uses: actions/checkout@v4
        with:
          path: wasm-rustc

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup swap (10 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config zstd

      - name: Download WASI SDK 32
        working-directory: rust
        run: |
          # bootstrap.toml references ./wasi-sdk-32.0-x86_64-linux/... relative to this dir.
          curl -fL -o wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-32/wasi-sdk-32.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk.tar.gz && rm wasi-sdk.tar.gz
          test -x wasi-sdk-32.0-x86_64-linux/bin/clang
          echo "WASI SDK ready: $(ls -d wasi-sdk-32.0-x86_64-linux)"
          # bootstrap requires WASI_SDK_PATH as an env var when building a -wasi target on CI
          # (cc_detect.rs) — the bootstrap.toml relative paths alone aren't accepted there.
          echo "WASI_SDK_PATH=$PWD/wasi-sdk-32.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=$PWD/wasi-sdk-32.0-x86_64-linux/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Configure riscv64 target (cc=clang, no-std)
        working-directory: rust
        run: |
          # The riscv64 no_std sysroot build wants riscv64-unknown-elf-gcc (absent); use clang instead.
          sudo apt-get install -y clang
          grep -q riscv64gc-unknown-none-elf bootstrap.toml || \
            printf '\n[target."riscv64gc-unknown-none-elf"]\ncc = "clang"\nno-std = true\n' >> bootstrap.toml

      - name: Build rustc.wasm (cranelift, prebuilt CI LLVM) — long
        working-directory: rust
        run: |
          # Uses the branch's shipped bootstrap.toml (host=wasm32-wasip1, cranelift, download-ci-llvm).
          # Unset GITHUB_ACTIONS/CI so bootstrap uses its NORMAL (non-CI) download-ci-llvm commit
          # detection. Its GitHub-Actions path assumes the checkout tip is a bors merge commit and
          # takes HEAD^1 as "upstream" — wrong for a fork branch tip, so it picks a fork commit with
          # no CI LLVM artifact (404). The non-CI path (author-based bors search) is what the working
          # local build uses. See src/build_helper/src/git.rs get_closest_upstream_commit.
          env -u GITHUB_ACTIONS -u CI python3 x.py install

      - name: Build riscv64 no_std sysroot
        working-directory: rust
        # Same GITHUB_ACTIONS/CI unset — this x.py call also resolves download-ci-llvm.
        run: env -u GITHUB_ACTIONS -u CI python3 x.py build library --target riscv64gc-unknown-none-elf

      - name: Package artifacts (main set)
        env:
          RUST_DIR: ${{ github.workspace }}/rust
          OUT_DIR: ${{ github.workspace }}/out
          PACKAGE_SET: main
        run: wasm-rustc/scripts/package-artifacts.sh

      - name: Upload workflow artifacts (main set)
        uses: actions/upload-artifact@v4
        with:
          name: main-${{ inputs.tag }}
          path: out/*.tar.zst
          retention-days: 7

  # Parallel job: the wasm32-wasip1 STD sysroot the browser links user programs
  # against (LLVM-legs, metadata-matched to rustc.wasm) + its single-file bundle.
  # Duplicates the stage1 host build (the price of parallelism on hosted runners)
  # but skips the long stage2 wasip1 cross build entirely.
  wasip1-sysroot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Clone the rust fork (riw-wasm20)
        run: |
          git clone https://github.com/${{ inputs.rust_repo }} rust
          git -C rust checkout "${{ inputs.rust_ref }}"

      - name: Checkout this repo (scripts)
        uses: actions/checkout@v4
        with:
          path: wasm-rustc

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Setup swap (10 GB)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config zstd

      - name: Download WASI SDK 32
        working-directory: rust
        run: |
          curl -fL -o wasi-sdk.tar.gz \
            https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-32/wasi-sdk-32.0-x86_64-linux.tar.gz
          tar -xzf wasi-sdk.tar.gz && rm wasi-sdk.tar.gz
          echo "WASI_SDK_PATH=$PWD/wasi-sdk-32.0-x86_64-linux" >> "$GITHUB_ENV"
          echo "WASI_SYSROOT=$PWD/wasi-sdk-32.0-x86_64-linux/share/wasi-sysroot" >> "$GITHUB_ENV"

      - name: Build wasm32-wasip1 std sysroot (stage1)
        working-directory: rust
        run: env -u GITHUB_ACTIONS -u CI python3 x.py build library --target wasm32-wasip1 --stage 1

      - name: Package artifacts (wasip1 set)
        env:
          RUST_DIR: ${{ github.workspace }}/rust
          OUT_DIR: ${{ github.workspace }}/out
          PACKAGE_SET: wasip1
        run: wasm-rustc/scripts/package-artifacts.sh

      # The egui rlib set rides along in this job because everything it needs is already here:
      # the native stage1 built above (rustc inside wasm cannot load proc-macro dylibs, so egui
      # has to be compiled on the host) and the very wasip1 std that is about to ship. Building
      # the rlibs against the staged sysroot keeps their metadata matched to it.
      - name: Checkout the playground (toolchain crate)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.playground_repo }}
          ref: ${{ inputs.playground_ref }}
          path: playground

      - name: Build the egui rlib set
        env:
          STAGE1_RUSTC: ${{ github.workspace }}/rust/build/host/stage1/bin/rustc
          STD_SYSROOT: ${{ github.workspace }}/out/stage/rustc/sysroot-wasip1
          OUT_DIR: ${{ github.workspace }}/out/stage/rustc/sysroot-egui
          BUILD_DIR: ${{ github.workspace }}/toolchain-target
        run: playground/toolchain/build-sysroot.sh

      - name: Package the egui sysroot
        run: |
          tar --zstd -C out/stage -cf out/egui-sysroot.tar.zst \
            rustc/sysroot-egui rustc/sysroot-egui.bundle
          ls -lh out/egui-sysroot.tar.zst

      - name: Upload workflow artifacts (wasip1 set)
        uses: actions/upload-artifact@v4
        with:
          name: wasip1-${{ inputs.tag }}
          path: out/*.tar.zst
          retention-days: 7

  # Gather both jobs' tarballs, produce one combined SHA256SUMS, optionally publish.
  release:
    needs: [build, wasip1-sysroot]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Combined checksums
        run: ( cd out && sha256sum *.tar.zst > SHA256SUMS && cat SHA256SUMS )

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS-${{ inputs.tag }}
          path: out/SHA256SUMS
          retention-days: 30

      - name: Publish Release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "artifacts-${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --title "artifacts-${{ inputs.tag }}" \
            --notes "PHASE-B forked cranelift rustc.wasm (compiles AND links std via in-process riwl) + sysroots. ${{ inputs.rust_repo }}@${{ inputs.rust_ref }}. Paste SHA256SUMS into the site's artifacts.lock." \
            out/rustc-wasm.tar.zst out/riscv64-sysroot.tar.zst out/std-sysroot.tar.zst out/wasip1-sysroot.tar.zst out/egui-sysroot.tar.zst out/SHA256SUMS
